pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProps = new File(settingsDir, "local.properties")
        if (localProps.exists()) {
            localProps.withInputStream { properties.load(it) }
        }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.0" apply false
    id "com.android.library" version "8.7.0" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}

include ":app"

// Vendor OpenEUICC modules (GPL-3). Paths must match OpenEUICC project() references.
include ":libs:lpac-jni"
project(":libs:lpac-jni").projectDir = new File(rootDir, "../third_party/OpenEUICC/libs/lpac-jni")
include ":app-deps"
project(":app-deps").projectDir = new File(rootDir, "../third_party/OpenEUICC/app-deps")
include ":app-common"
project(":app-common").projectDir = new File(rootDir, "../third_party/OpenEUICC/app-common")
