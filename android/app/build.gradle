plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def projectKeystorePropertiesFile = rootProject.file("key.properties")
def userKeystorePropertiesFile = new File(
    System.getProperty("user.home"),
    ".android/lumina-euicc/key.properties"
)
def keystorePropertiesFile = projectKeystorePropertiesFile.exists()
    ? projectKeystorePropertiesFile
    : userKeystorePropertiesFile
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

    def requiredSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missingSigningProperties = requiredSigningProperties.findAll {
        !keystoreProperties.getProperty(it)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException(
            "${keystorePropertiesFile} is missing: ${missingSigningProperties.join(', ')}"
        )
    }

    def configuredKeystoreFile = rootProject.file(keystoreProperties.getProperty("storeFile"))
    if (!configuredKeystoreFile.isFile()) {
        throw new GradleException(
            "Release keystore does not exist: ${configuredKeystoreFile}"
        )
    }
} else if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
    throw new GradleException(
        "Release signing config not found. Copy android/key.properties.example to " +
        "android/key.properties or ${userKeystorePropertiesFile}."
    )
}

android {
    namespace = "top.syngnat.lumina.euicc"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "top.syngnat.lumina.euicc"
        minSdk = 28
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters += ["armeabi-v7a", "arm64-v8a", "x86_64"]
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword = keystoreProperties.getProperty("storePassword")
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            minifyEnabled = false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation project(":app-common")
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    testImplementation "junit:junit:4.13.2"
}
